version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels: ['chore', 'dependencies']
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
