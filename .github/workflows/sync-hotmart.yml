name: Sync Hotmart

# Manual: trae el catálogo/estado de la cuenta de Hotmart al repo.
# Requiere los secretos HOTMART_CLIENT_ID y HOTMART_CLIENT_SECRET.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sincronizar catálogo de Hotmart
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ejecutar sync
        env:
          HOTMART_CLIENT_ID: ${{ secrets.HOTMART_CLIENT_ID }}
          HOTMART_CLIENT_SECRET: ${{ secrets.HOTMART_CLIENT_SECRET }}
        run: node scripts/sync-hotmart.mjs

      - name: Commit del resultado (si cambió)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/hotmart-products.json
          git diff --cached --quiet || git commit -m "Sync catálogo Hotmart"
          git push
