# CloudPanel vhost for sably.co. Node/Dockge publishes only 127.0.0.1:4323.
# Install as the existing site's vhost, then run nginx -t before reload.
# Certificate and key are managed on the host by CloudPanel.
#
# Real-IP trust is deliberately declared at SERVER level. A non-empty local
# set_real_ip_from list replaces the inherited http-level list; in particular,
# this site must never inherit an existing global 0.0.0.0/0 trust directive.
# https://nginx.org/en/docs/http/ngx_http_realip_module.html
# https://github.com/nginx/nginx/blob/master/src/http/modules/ngx_http_realip_module.c
# Cloudflare ranges verified 2026-10-10 from the official endpoints:
# https://www.cloudflare.com/ips-v4
# https://www.cloudflare.com/ips-v6

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name sably.co www.sably.co;
    root /home/sably-site/htdocs/sably.co;

    ssl_certificate /etc/nginx/ssl-certificates/sably.co.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/sably.co.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /home/sably-site/logs/nginx/access.log;
    error_log /home/sably-site/logs/nginx/error.log;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    set_real_ip_from 127.0.0.1/32;
    set_real_ip_from ::1/128;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    client_max_body_size 128m;
    client_body_timeout 300s;
    send_timeout 3600s;

    # Let CloudPanel renew a Let's Encrypt certificate for either hostname.
    # This prefix wins over the dotfile deny rule and bypasses HTTPS redirects;
    # it is harmless when Cloudflare Origin CA manages the certificate instead.
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    # Preserve EmDash's /.well-known OAuth discovery and /_emdash/.well-known
    # auth routes; those still go through the app's normal location below.
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    location / {
        # Return-only conditions are safe. The redirect authority is fixed,
        # never copied from a request header; paths and query strings survive.
        if ($scheme = http) {
            return 301 https://sably.co$request_uri;
        }
        if ($host = www.sably.co) {
            return 301 https://sably.co$request_uri;
        }

        proxy_pass http://127.0.0.1:4323;
        proxy_http_version 1.1;

        # Only validated transport metadata reaches Astro/EmDash. The app
        # trusts cf-connecting-ip and the canonical HTTPS forwarded origin.
        # $remote_addr is rewritten only for peers in the trusted list above.
        proxy_set_header Host sably.co;
        proxy_set_header X-Forwarded-Host sably.co;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header True-Client-IP "";
        proxy_set_header Connection "";

        # Keep streaming/SSE and long CMS jobs at the Node origin. Cache policy
        # and invalidation belong to the application, without an Nginx cache.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_redirect off;
    }
}
